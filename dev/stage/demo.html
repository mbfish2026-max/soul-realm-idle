<!doctype html>
<html lang="zh-CN"><head><base href="../../"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>战斗表现演示</title><link rel="stylesheet" href="stage.css"><style>
*{box-sizing:border-box}body{margin:0;background:#e6dfcd;color:#302f28;font-family:serif}.app{width:100%;max-width:390px;min-height:844px;margin:auto;background:#f3eee2}.heading{text-align:center;padding:16px 0 10px;letter-spacing:4px;font-size:22px;border-bottom:1px solid #c9a96a}.controls{display:flex;gap:7px;padding:12px 10px;justify-content:center}.controls button{flex:1;min-width:0;height:45px;border:1px solid #b79a5f;border-radius:24px;background:radial-gradient(at 35% 30%,#dae7d8,#709e85);color:#244c3a;font-family:inherit;font-size:14px;cursor:pointer}.controls button:last-child{background:#ead8a3}.paper{margin:4px 14px;padding:12px;border:1px solid #c9a96a;outline:3px solid #c9a96a33;border-radius:8px;background:#faf6ecc9;min-height:110px;font-size:13px;line-height:23px}.paper p{margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.note{padding:12px;text-align:center;color:#7f7663;font-size:11px}.sr-stage{height:528px}
