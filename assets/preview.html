<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Assets</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3eee2;color:#2b362e;font:13px Georgia,serif}header{padding:16px;border-bottom:1px solid #c9a96a}h1{font-size:20px;margin:0 0 8px}p{margin:6px 0}nav{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}button,select{background:#fcf8ee;color:#2f5f48;border:1px solid #bca16a;border-radius:5px;padding:7px;cursor:pointer}main{padding:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(166px,1fr));gap:10px}figure{margin:0;background:#fffaf0;border:1px solid #d0c19b;border-radius:6px;overflow:hidden}.art{height:170px;display:flex;align-items:center;justify-content:center;background:repeating-conic-gradient(#e3e8df 0% 25%,#f4f4ed 0% 50%) 50%/20px 20px}.art img{max-width:100%;max-height:100%;object-fit:contain}figcaption{padding:8px;font:11px monospace;overflow-wrap:anywhere;line-height:1.6}.bg .art{height:260px}small{color:#736c5a}input{width:80px}#status{min-height:18px}
</style></head><body><header><h1>SR · Assets</h1><p id="count"></p><small>Transparent checker · original ink wash assets</small><nav><select id="filter"><option value="">All</option></select><button id="music">BGM ▶</button><input aria-label="Volume" id="volume" type="range" min="0" max="1" step="0.05" value="0.3"></nav><details><summary>Audio · SFX</summary><nav id="sounds"></nav><p id="status"></p></details></header><main id="grid"></main>
<script src="manifest.js"></script><script src="../audio/sfx.js"></script><script src="../audio/bgm.js"></script><script>
(function(){'use strict';var order=['hero','pet','mob','boss','background','icon','ui'];var entries=Object.entries(SR.ASSETS).sort(function(a,b){return order.indexOf(a[1].use)-order.indexOf(b[1].use);}),filter=document.getElementById('filter'),grid=document.getElementById('grid');
Array.from(new Set(entries.map(function(e){return e[1].use;}))).forEach(function(s){var o=document.createElement('option');o.value=s;o.textContent=s;filter.appendChild(o);});
function render(){grid.textContent='';entries.filter(function(e){return !filter.value||e[1].use===filter.value;}).forEach(function(e){var k=e[0],a=e[1],f=document.createElement('figure'),box=document.createElement('div'),im=document.createElement('img'),cap=document.createElement('figcaption');f.className=a.use==='background'?'bg':'';box.className='art';im.src='../'+a.file;im.alt=k;im.width=a.w;im.height=a.h;cap.textContent=k+' · '+a.w+' × '+a.h;box.appendChild(im);f.appendChild(box);f.appendChild(cap);grid.appendChild(f);});}
filter.onchange=render;document.getElementById('count').textContent=entries.length+' generated assets';render();
SR.audio.ids.forEach(function(id){var b=document.createElement('button');b.textContent=id;b.onclick=function(){setTimeout(function(){document.getElementById('status').textContent=id+': '+SR.audio.play(id);},30);};document.getElementById('sounds').appendChild(b);});
document.getElementById('music').onclick=function(){SR.bgm.setEnabled(!SR.bgm.isEnabled());this.textContent=SR.bgm.isEnabled()?'BGM ■':'BGM ▶';};document.getElementById('volume').oninput=function(){SR.bgm.setVolume(this.value);SR.audio.setVolume(this.value);};
})();
</script></body></html>
